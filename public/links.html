<!DOCTYPE html>
<html lang="en" class="booting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Links · BlueJ</title>
<meta name="description" content="BlueJ link directory and status dashboard.">
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Inter:wght@400;500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=917d1dad">
</head>
<body>

<div class="links-page">

  <!-- Left rail — 352px ------------------------------------------------- -->
  <aside class="rail">
    <h1 class="rail__title">Total links</h1>
    <div class="rail__chart">
      <div class="chart" id="chart" role="img" aria-label="Total links per site"></div>
    </div>
    <a class="btn btn--sm btn--ghost rail__back" href="home.html">Back to home</a>
  </aside>

  <!-- Main panel — 48px radius on the left edge --------------------------- -->
  <main class="panel">

    <div class="panel__top">
      <section class="news" aria-labelledby="news-date">
        <p class="news__date" id="news-date"></p>
        <p class="news__body" id="news-body"></p>
      </section>

      <section class="update" aria-label="Recently added links">
        <p class="update__title">New links:</p>
        <ul class="update__list" id="update-list"></ul>
        <p class="update__total" id="update-total"></p>
      </section>
    </div>

    <!-- Filter bar — 992x48 -->
    <div class="filters">
      <div class="dropdown">
        <button class="chip" id="filter-status" type="button" aria-haspopup="true" aria-expanded="false">
          <span id="filter-status-label">Status</span>
          <svg class="chip__caret" viewBox="0 0 10 10" aria-hidden="true">
            <path d="M1 3l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="dropdown">
        <button class="chip" id="filter-type" type="button" aria-haspopup="true" aria-expanded="false">
          <span id="filter-type-label">Type</span>
          <svg class="chip__caret" viewBox="0 0 10 10" aria-hidden="true">
            <path d="M1 3l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <button class="chip" id="refresh" type="button" title="Reload from Supabase">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M8 3a5 5 0 1 0 4.6 3.1" fill="none" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round"/>
          <path d="M13 2v4H9" fill="none" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Refresh
      </button>

      <span class="filters__spacer"></span>
      <span class="source-badge" id="data-source" hidden></span>
      <span class="filters__count" id="result-count"></span>
      <label class="visually-hidden" for="filter-search">Search links</label>
      <input class="filters__search" id="filter-search" type="search" placeholder="Search links">
    </div>

    <!-- Result rows — 992x64 each -->
    <div class="results" id="results"></div>
  </main>
</div>

<script src="js/store.js?v=d40f77e7"></script>
<script src="js/data.js?v=f4da5b0b"></script>
<script src="js/config.js?v=c1732750"></script>
<script src="js/auth.js?v=92d1ff2e"></script>
<script src="js/markdown.js?v=adb11e86"></script>
<script src="js/supabase.js?v=b7401c4e"></script>
<script src="js/links.js?v=a812f53a"></script>
</body>
</html>
