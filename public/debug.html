<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlueJ · storage check</title>
<link rel="stylesheet" href="css/styles.css?v=917d1dad">
<style>
  .diag { max-width: 760px; margin: 0 auto; padding: 32px 24px 64px; display: flex; flex-direction: column; gap: 24px; }
  .diag h1 { font-size: 24px; font-weight: 500; }
  .diag h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--text-muted); margin-bottom: 8px; }
  .diag table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .diag td { padding: 8px 10px; border-bottom: 1px solid var(--surface-2); vertical-align: top; }
  .diag td:first-child { color: var(--text-dim); width: 190px; }
  .diag pre { margin: 0; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .ok { color: #6ee7a8; } .bad { color: var(--danger); }
  .diag .row { display: flex; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>

<div class="diag">
  <h1>BlueJ storage check</h1>
  <p style="color:var(--text-dim);font-size:14px">
    This page never redirects. If sign-in is bouncing you between pages, open
    this and send a screenshot — it shows exactly what your browser allows.
  </p>

  <section><h2>Page</h2><table id="page"></table></section>
  <section><h2>Storage tiers</h2><table id="tiers"></table></section>
  <section><h2>Stored data</h2><table id="data"></table></section>

  <div class="row">
    <button class="btn btn--sm btn--ghost" id="copy" type="button">Copy report</button>
    <button class="btn btn--sm btn--danger" id="wipe" type="button">Erase all BlueJ data</button>
    <a class="btn btn--sm btn--ghost" href="index.html">Go to login</a>
  </div>
</div>

<script src="js/store.js?v=d40f77e7"></script>
<script src="js/data.js?v=f4da5b0b"></script>
<script>
(function () {
  var rows = {};

  function put(tableId, label, value, cls) {
    var tr = document.createElement('tr');
    var td1 = document.createElement('td');
    td1.textContent = label;
    var td2 = document.createElement('td');
    var pre = document.createElement('pre');
    pre.textContent = value;
    if (cls) { pre.className = cls; }
    td2.appendChild(pre);
    tr.appendChild(td1); tr.appendChild(td2);
    document.getElementById(tableId).appendChild(tr);
    rows[label] = value;
  }

  put('page', 'URL', location.href);
  put('page', 'Protocol', location.protocol,
      location.protocol === 'file:' ? 'bad' : 'ok');
  put('page', 'Secure context', String(window.isSecureContext),
      window.isSecureContext ? 'ok' : 'bad');
  put('page', 'Cookies enabled', String(navigator.cookieEnabled),
      navigator.cookieEnabled ? 'ok' : 'bad');
  put('page', 'User agent', navigator.userAgent);

  /* Raw availability, independent of store.js. */
  function rawCheck(name, fn) {
    try {
      var r = fn();
      put('tiers', name, r, /^works/.test(r) ? 'ok' : 'bad');
    } catch (err) {
      put('tiers', name, 'THROWS: ' + err.message, 'bad');
    }
  }

  rawCheck('window.indexedDB', function () {
    return window.indexedDB ? 'present' : 'undefined';
  });
  rawCheck('localStorage', function () {
    localStorage.setItem('__t', '1');
    var v = localStorage.getItem('__t');
    localStorage.removeItem('__t');
    return v === '1' ? 'works' : 'accepted write but read back ' + v;
  });
  rawCheck('sessionStorage', function () {
    sessionStorage.setItem('__t', '1');
    var v = sessionStorage.getItem('__t');
    sessionStorage.removeItem('__t');
    return v === '1' ? 'works' : 'accepted write but read back ' + v;
  });

  BlueJ.ready().then(function () {
    put('tiers', 'Tiers BlueJ adopted', BlueJ.storageKind(),
        BlueJ.canPersist() ? 'ok' : 'bad');
    put('tiers', 'Can survive navigation', String(BlueJ.canPersist()),
        BlueJ.canPersist() ? 'ok' : 'bad');

    var session = BlueJ.Session.get();
    put('data', 'session', session ? JSON.stringify(session) : '(none)',
        session ? 'ok' : '');
    put('data', 'prefs', JSON.stringify(BlueJ.Prefs.get()));
    put('data', 'profile', JSON.stringify(BlueJ.Profile.get(), function (k, v) {
      return typeof v === 'string' && v.slice(0, 5) === 'data:' ? '[image ' + v.length + ' chars]' : v;
    }));
    put('data', 'shortcuts', BlueJ.Shortcuts.all().map(function (s) { return s.name; }).join(', '));

    /* What each tier holds for `session` — a mismatch here is the bounce. */
    ['localStorage', 'sessionStorage'].forEach(function (kind) {
      var raw;
      try { raw = window[kind].getItem('bluej.session'); }
      catch (err) { raw = 'THROWS: ' + err.message; }
      put('data', kind + '["bluej.session"]', raw === null ? '(none)' : String(raw));
    });

    if (window.indexedDB) {
      var req = indexedDB.open('bluej');
      req.onsuccess = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains('kv')) {
          put('data', 'indexedDB bluej/kv', 'OBJECT STORE MISSING', 'bad');
          return;
        }
        var g = db.transaction('kv', 'readonly').objectStore('kv').get('session');
        g.onsuccess = function () {
          put('data', 'indexedDB bluej/kv session',
              g.result ? JSON.stringify(g.result) : '(none)', g.result ? 'ok' : '');
        };
        g.onerror = function () { put('data', 'indexedDB bluej/kv session', 'READ ERROR', 'bad'); };
      };
      req.onerror = function () {
        put('data', 'indexedDB bluej', 'OPEN ERROR: ' + (req.error && req.error.name), 'bad');
      };
    }
  });

  document.getElementById('copy').addEventListener('click', function () {
    var text = Object.keys(rows).map(function (k) { return k + ': ' + rows[k]; }).join('\n');
    navigator.clipboard.writeText(text).then(function () { BlueJ.toast('Report copied'); },
      function () { BlueJ.toast('Could not copy', 'error'); });
  });

  document.getElementById('wipe').addEventListener('click', function () {
    ['localStorage', 'sessionStorage'].forEach(function (kind) {
      try {
        Object.keys(window[kind]).forEach(function (k) {
          if (k.indexOf('bluej.') === 0) { window[kind].removeItem(k); }
        });
      } catch (err) { /* blocked */ }
    });
    try { indexedDB.deleteDatabase('bluej'); } catch (err) { /* blocked */ }
    BlueJ.toast('Erased — reloading');
    setTimeout(function () { location.reload(); }, 700);
  });
})();
</script>
</body>
</html>
