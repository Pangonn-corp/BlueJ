<!DOCTYPE html>
<html lang="en" class="booting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · BlueJ</title>
<meta name="description" content="BlueJ link metrics, reports and suggestions.">
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Inter:wght@400;500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=c71ce6ad">
</head>
<body>

<div class="admin">

  <header class="admin__bar">
    <div class="admin__title">
      <h1>Admin</h1>
      <span class="source-badge" id="data-source" hidden></span>
    </div>
    <nav class="admin__nav">
      <span class="admin__who" id="who"></span>
      <button class="chip" id="refresh" type="button">Refresh</button>
      <a class="chip" href="links.html">Links</a>
      <a class="chip" href="home.html">Home</a>
    </nav>
  </header>

  <div id="bypass" hidden></div>

  <!-- Headline numbers ---------------------------------------------------- -->
  <section class="stats" id="stats" aria-label="Key metrics"></section>

  <div class="admin__grid">

    <!-- Discovery trend --------------------------------------------------- -->
    <section class="panel-card admin__wide">
      <div class="panel-card__head">
        <h2>Links discovered</h2>
        <div class="seg" id="trend-range" role="group" aria-label="Trend range">
          <button class="seg__btn is-active" type="button" data-days="30">30d</button>
          <button class="seg__btn" type="button" data-days="90">90d</button>
          <button class="seg__btn" type="button" data-days="365">1y</button>
        </div>
      </div>
      <div class="trend" id="trend"></div>
    </section>

    <!-- Status split ------------------------------------------------------ -->
    <section class="panel-card">
      <div class="panel-card__head"><h2>Status</h2></div>
      <div id="status-split"></div>
    </section>

    <!-- Providers --------------------------------------------------------- -->
    <section class="panel-card">
      <div class="panel-card__head">
        <h2>Providers</h2>
        <span class="panel-card__note" id="provider-count"></span>
      </div>
      <ol class="rank" id="providers"></ol>
    </section>

    <!-- News -------------------------------------------------------------- -->
    <section class="panel-card admin__wide">
      <div class="panel-card__head">
        <h2>News</h2>
        <span class="panel-card__note" id="news-note"></span>
        <button class="chip chip--sm" id="news-new" type="button">New post</button>
      </div>

      <!-- Saving calls a database function that checks is_admin on the
           signed-in account; the page carries no credential that can write. -->
      <form class="editor" id="news-editor" hidden onsubmit="return false">
        <h3 class="editor__title" id="news-editor-title">New post</h3>

        <label class="editor__field">
          <span>Title</span>
          <input type="text" id="news-title" maxlength="120" placeholder="Optional">
        </label>

        <div class="editor__split">
          <label class="editor__field">
            <span>Body (Markdown)</span>
            <textarea id="news-body" rows="10"
              placeholder="## Heading&#10;&#10;- a point&#10;- [a link](https://example.com)"></textarea>
          </label>
          <div class="editor__field">
            <span>Preview</span>
            <div class="md editor__preview" id="news-preview"></div>
          </div>
        </div>

        <label class="editor__check">
          <input type="checkbox" id="news-pinned">
          <span>Pin to the top of the Links page</span>
        </label>

        <p class="editor__error" id="news-error" role="alert"></p>

        <div class="editor__actions">
          <button class="chip chip--primary" id="news-save" type="button">Save</button>
          <button class="chip" id="news-cancel" type="button">Cancel</button>
        </div>
      </form>

      <div class="news-list" id="news"></div>
    </section>

    <!-- Accounts ---------------------------------------------------------- -->
    <section class="panel-card admin__wide">
      <div class="panel-card__head">
        <h2>Accounts</h2>
        <span class="panel-card__note" id="account-note"></span>
      </div>
      <div class="accounts" id="accounts"></div>
    </section>

    <!-- Reports ----------------------------------------------------------- -->
    <section class="panel-card admin__wide">
      <div class="panel-card__head">
        <h2>Link reports</h2>
        <span class="panel-card__note" id="report-note"></span>
      </div>
      <div class="cards" id="reports"></div>
    </section>

    <!-- Category suggestions ---------------------------------------------- -->
    <section class="panel-card admin__wide">
      <div class="panel-card__head">
        <h2>Category suggestions</h2>
        <span class="panel-card__note" id="suggestion-note"></span>
      </div>
      <div class="cards" id="suggestions"></div>
    </section>

  </div>
</div>

<script src="js/store.js?v=d40f77e7"></script>
<script src="js/data.js?v=f4da5b0b"></script>
<script src="js/config.js?v=38ac1048"></script>
<script src="js/auth.js?v=a8f148e7"></script>
<script src="js/markdown.js?v=adb11e86"></script>
<script src="js/supabase.js?v=b7401c4e"></script>
<script src="js/admin.js?v=c135b9a2"></script>
</body>
</html>
