<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="0; url=./">
    <title>Redirecting...</title>
  </head>
  <body>
    <script>
      const path = location.pathname.replace(/\/$/, '') + location.search + location.hash;
      location.replace('./' + '?_=' + encodeURIComponent(path));
    </script>
  </body>
</html>
